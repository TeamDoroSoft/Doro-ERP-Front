name: Publish Provider Admin image to ECR

on:
  workflow_dispatch:

concurrency:
  group: provider-admin-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish immutable Provider Admin image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

    steps:
      - name: Check required GitHub variables
        env:
          AWS_FRONTEND_PUBLISH_ROLE_ARN: ${{ vars.AWS_FRONTEND_PUBLISH_ROLE_ARN }}
          FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Provider Admin publishing is restricted to the main branch." >&2
            exit 1
          fi

          missing=0
          for name in AWS_FRONTEND_PUBLISH_ROLE_ARN FRONTEND_ECR_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Environment 'prod' variable ${name} is required." >&2
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "${FRONTEND_ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "FRONTEND_ECR_REPOSITORY is not a valid private ECR repository name." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Provider Admin unit test
        run: npm exec -- vitest run src/admin/__tests__/ProviderAdminApp.spec.ts

      - name: Build Provider Admin artifact
        run: npm run build:admin

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_FRONTEND_PUBLISH_ROLE_ARN }}
          role-session-name: doro-erp-admin-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image tag
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          result="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" 2>&1)"
          status=$?
          set -e

          if [[ ${status} -eq 0 ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${result}" == *"ImageNotFoundException"* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${result}" >&2
            exit "${status}"
          fi

      - name: Build Provider Admin container
        if: steps.image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile.admin \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push immutable image to ECR
        if: steps.image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Verify published image digest
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ -z "${digest}" || "${digest}" == "None" ]]; then
            echo "ECR did not return an image digest for ${ECR_REPOSITORY}:${IMAGE_TAG}." >&2
            exit 1
          fi

          echo "### Provider Admin image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Record this digest in the approved Infra Kustomize overlay before rollout." >> "${GITHUB_STEP_SUMMARY}"
