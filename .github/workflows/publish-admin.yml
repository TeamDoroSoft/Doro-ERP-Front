name: Publish Provider Admin image to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: provider-admin-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish immutable Provider Admin image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    outputs:
      digest: ${{ steps.published-image.outputs.digest }}

    steps:
      - name: Check required GitHub variables
        env:
          AWS_ADMIN_ECR_PUSH_ROLE_ARN: ${{ vars.AWS_ADMIN_ECR_PUSH_ROLE_ARN }}
          FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Provider Admin publishing is restricted to the main branch." >&2
            exit 1
          fi

          missing=0
          for name in AWS_ADMIN_ECR_PUSH_ROLE_ARN FRONTEND_ECR_REPOSITORY; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Environment 'prod' variable ${name} is required." >&2
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "${FRONTEND_ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "FRONTEND_ECR_REPOSITORY is not a valid private ECR repository name." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Provider Admin unit test
        run: npm exec -- vitest run src/admin/__tests__/ProviderAdminApp.spec.ts

      - name: Install Chromium for Provider Admin Browser E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Provider Admin Browser E2E
        run: npm run test:e2e:admin

      - name: Build Provider Admin artifact
        run: npm run build:admin

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ADMIN_ECR_PUSH_ROLE_ARN }}
          role-session-name: doro-erp-admin-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image tag
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          result="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" 2>&1)"
          status=$?
          set -e

          if [[ ${status} -eq 0 ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${result}" == *"ImageNotFoundException"* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${result}" >&2
            exit "${status}"
          fi

      - name: Build Provider Admin container
        if: steps.image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile.admin \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push immutable image to ECR
        if: steps.image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Verify published image digest
        id: published-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ -z "${digest}" || "${digest}" == "None" ]]; then
            echo "ECR did not return an image digest for ${ECR_REPOSITORY}:${IMAGE_TAG}." >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "### Provider Admin image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "A GitOps release PR will record this digest for rollout." >> "${GITHUB_STEP_SUMMARY}"

  update-gitops:
    name: Open Provider Admin GitOps release PR
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check GitOps automation configuration
        env:
          AWS_ADMIN_ECR_PUSH_ROLE_ARN: ${{ vars.AWS_ADMIN_ECR_PUSH_ROLE_ARN }}
          GITOPS_APP_ID: ${{ vars.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          missing=0
          for name in AWS_ADMIN_ECR_PUSH_ROLE_ARN GITOPS_APP_ID GITOPS_APP_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Environment 'prod' value ${name} is required." >&2
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ADMIN_ECR_PUSH_ROLE_ARN }}
          role-session-name: doro-erp-admin-gitops-${{ github.run_id }}

      - name: Create GitOps GitHub App token
        id: gitops-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: TeamDoroSoft
          repositories: Doro-ERP-GitOps

      - name: Check out GitOps repository
        uses: actions/checkout@v6
        with:
          repository: TeamDoroSoft/Doro-ERP-GitOps
          ref: main
          token: ${{ steps.gitops-app.outputs.token }}
          path: gitops

      - name: Set up kubectl for Kustomize validation
        uses: azure/setup-kubectl@v4

      - name: Record Provider Admin image digest
        working-directory: gitops
        env:
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          ./deploy/scripts/record-prod-alpha-admin-image.sh \
            "${SOURCE_REVISION}" \
            "${IMAGE_DIGEST}"

          git diff --check
          kubectl kustomize deploy/overlays/prod/alpha >/dev/null

      - name: Create or update Provider Admin release PR
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.gitops-app.outputs.token }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet -- deploy/overlays/prod/alpha/kustomization.yaml; then
            echo "GitOps already records Provider Admin ${SOURCE_REVISION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          branch="automation/provider-admin-${SOURCE_REVISION}"
          short_revision="${SOURCE_REVISION:0:12}"

          git config user.name "doro-erp-release-bot[bot]"
          git config user.email "doro-erp-release-bot[bot]@users.noreply.github.com"
          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          git switch -C "${branch}"
          git add deploy/overlays/prod/alpha/kustomization.yaml
          git commit -m "release: pin Provider Admin image for ${short_revision}"
          git push --force-with-lease --set-upstream origin "${branch}"

          existing_pr="$(gh pr list \
            --repo TeamDoroSoft/Doro-ERP-GitOps \
            --head "${branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "${existing_pr}" ]]; then
            pr_url="${existing_pr}"
          else
            pr_body="$(printf '%s\n' \
              '## Release source' \
              '' \
              "- Repository: \`${SOURCE_REPOSITORY}\`" \
              "- Revision: \`${SOURCE_REVISION}\`" \
              "- Workflow: ${SOURCE_RUN_URL}" \
              '' \
              '## Changes' \
              '' \
              '- Pins the Provider Admin image to its verified ECR digest.' \
              '- Preserves the reviewed Admin Front, Private Edge and Internal Gateway topology.' \
              '- Keeps Provider Admin disconnected from Public CloudFront and the Public Gateway.' \
              '' \
              '## Validation' \
              '' \
              '- The Git SHA tag was resolved from ECR.' \
              '- `git diff --check` passed.' \
              '- Prod Alpha Kustomize rendering passed.')"

            pr_url="$(gh pr create \
              --repo TeamDoroSoft/Doro-ERP-GitOps \
              --base main \
              --head "${branch}" \
              --title "release: deploy Provider Admin ${short_revision} to prod" \
              --body "${pr_body}")"
          fi

          echo "### Provider Admin GitOps release PR" >> "${GITHUB_STEP_SUMMARY}"
          echo "${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
