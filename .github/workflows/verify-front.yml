name: Verify front

on:
  workflow_dispatch:

concurrency:
  group: front-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build both view layers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Oxlint without modifying files
        run: npm exec -- oxlint .

      - name: Run ESLint without modifying files
        run: npm exec -- eslint .

      - name: Run unit tests once
        run: npm run test:unit -- --run

      - name: Build Public POS and Kiosk
        run: npm run build

      - name: Build Provider Admin
        run: npm run build:admin

      - name: Build Provider Admin container
        run: docker build --file Dockerfile.admin --tag doro-erp-provider-admin:${{ github.sha }} .
