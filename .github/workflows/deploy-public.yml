name: Deploy Public front to S3

on:
  workflow_dispatch:

concurrency:
  group: public-front-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Public POS and Kiosk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

    steps:
      - name: Check required GitHub variables
        env:
          AWS_FRONTEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          FRONTEND_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          KIOSK_APP_ORIGIN: ${{ vars.KIOSK_APP_ORIGIN }}
          PUBLIC_TOSS_CLIENT_KEY: ${{ vars.PUBLIC_TOSS_CLIENT_KEY }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Public deployment is restricted to the main branch." >&2
            exit 1
          fi

          missing=0
          for name in AWS_FRONTEND_DEPLOY_ROLE_ARN FRONTEND_S3_BUCKET FRONTEND_CLOUDFRONT_DISTRIBUTION_ID PUBLIC_APP_ORIGIN KIOSK_APP_ORIGIN PUBLIC_TOSS_CLIENT_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "GitHub Environment 'prod' variable ${name} is required." >&2
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "${PUBLIC_APP_ORIGIN}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ || ! "${KIOSK_APP_ORIGIN}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ || "${PUBLIC_APP_ORIGIN}" == "${KIOSK_APP_ORIGIN}" ]]; then
            echo "PUBLIC_APP_ORIGIN and KIOSK_APP_ORIGIN must be distinct HTTPS origins without paths." >&2
            exit 1
          fi
          if [[ ! "${PUBLIC_TOSS_CLIENT_KEY}" =~ ^test_gck_[A-Za-z0-9_-]+$ ]]; then
            echo "PUBLIC_TOSS_CLIENT_KEY must be a Toss test client key (test_gck_...)." >&2
            exit 1
          fi
          if [[ "${FRONTEND_S3_BUCKET}" == s3://* || "${FRONTEND_S3_BUCKET}" == */* ]]; then
            echo "FRONTEND_S3_BUCKET must be a bucket name without s3:// or a path." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests once
        run: npm run test:unit -- --run

      - name: Build Public POS and Kiosk
        env:
          VITE_TOSS_CLIENT_KEY: ${{ vars.PUBLIC_TOSS_CLIENT_KEY }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          VITE_KIOSK_APP_ORIGIN: ${{ vars.KIOSK_APP_ORIGIN }}
        run: npm run build

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: doro-erp-front-${{ github.run_id }}

      - name: Verify deployment bucket
        env:
          S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: aws s3api head-bucket --bucket "${S3_BUCKET}"

      - name: Upload immutable Vite assets
        env:
          S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload Public entry files
        env:
          S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Write deployment summary
        env:
          S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "### Public front" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Revision: \`${{ github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- S3 bucket: \`${S3_BUCKET}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- CloudFront distribution: \`${CLOUDFRONT_DISTRIBUTION_ID}\`" >> "${GITHUB_STEP_SUMMARY}"
